{% extends "base.html" %}

{% block title %}Добавить связь{% endblock %}

{% block content %}
<div class="pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="fas fa-plus me-2"></i>Добавить связь</h1>
</div>

<div class="col-lg-6">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <form method="post" action="{% url 'connections:add_connection' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Категория</label>
                    <input type="text" name="category" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Описание</label>
                    <textarea name="text" class="form-control" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-2"></i>Сохранить
                </button>
                <a href="{% url 'connections:connections' %}" class="btn btn-outline-secondary ms-2">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
