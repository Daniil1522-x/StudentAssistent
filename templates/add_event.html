{% extends "base.html" %}

{% block title %}Добавить событие{% endblock %}

{% block content %}
<div class="pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="fas fa-calendar-plus me-2"></i>Добавить событие</h1>
</div>

<div class="col-lg-6">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <form method="post" action="{% url 'calendar:add_event' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Тип события</label>
                    <select name="event_type" class="form-select" required>
                        <option value="important">Важная дата</option>
                        <option value="session">Сессия</option>
                        <option value="holiday">Каникулы</option>
                        <option value="other">Другое</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Название</label>
                    <input type="text" name="title" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Дата</label>
                    <input type="date" name="date" class="form-control" value="{{ selected_date }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Описание</label>
                    <textarea name="description" class="form-control" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-2"></i>Сохранить
                </button>
                <a href="{% url 'calendar:calendar' %}" class="btn btn-outline-secondary ms-2">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
