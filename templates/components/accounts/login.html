{% extends "base.html" %}

{% block title %}Вход — Студенческий Помощник{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-5 col-xl-4">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <!-- Заголовок карточки -->
                <div class="card-header bg-gradient-primary text-white text-center py-4">
                    <i class="fas fa-graduation-cap fa-3x mb-3"></i>
                    <h3 class="mb-0">Студенческий Помощник</h3>
                    <small class="opacity-75">Вход в личный кабинет</small>
                </div>

                <div class="card-body p-4 p-md-5">
                    <!-- Сообщения -->
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show mb-4" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}

                        <!-- Поле логина -->
                        <div class="mb-4">
                            <label for="username" class="form-label fw-bold">Логин</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="fas fa-user text-primary"></i>
                                </span>
                                <input type="text" class="form-control" id="username" name="username" required autofocus placeholder="Введите логин">
                            </div>
                        </div>

                        <!-- Поле пароля -->
                        <div class="mb-4">
                            <label for="password" class="form-label fw-bold">Пароль</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="fas fa-lock text-primary"></i>
                                </span>
                                <input type="password" class="form-control" id="password" name="password" required placeholder="Введите пароль">
                                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Скрытое поле next (для возврата после логина) -->
                        <input type="hidden" name="next" value="{{ request.GET.next|default:'/' }}">

                        <!-- Кнопка входа -->
                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="fas fa-sign-in-alt me-2"></i> Войти
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <small class="text-muted">
                            <i class="fas fa-shield-alt me-1"></i> Вход защищён шифрованием
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Скрипт показа/скрытия пароля -->
<script>
const togglePassword = document.getElementById('togglePassword');
const passwordInput = document.getElementById('password');

if (togglePassword && passwordInput) {
    togglePassword.addEventListener('click', function () {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.querySelector('i').classList.toggle('fa-eye');
        this.querySelector('i').classList.toggle('fa-eye-slash');
    });
}
</script>
{% endblock %}
