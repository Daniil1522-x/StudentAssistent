<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Студенческий Помощник</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            color: #333;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            padding: 2.5rem;
            max-width: 420px;
            width: 100%;
        }
        .logo i { font-size: 3.5rem; color: #667eea; }
        .btn-primary { background: #667eea; border: none; }
        .btn-primary:hover { background: #5a6ee6; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <div class="login-card mx-auto">
                    <div class="logo mb-4 text-center">
                        <i class="fas fa-graduation-cap"></i>
                        <h3 class="mt-2 fw-bold">Регистрация</h3>
                    </div>

                    {% if form.errors %}
                        <div class="alert alert-danger">
                            Пожалуйста исправьте ошибки ниже
                        </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label fw-bold">{{ field.label }}</label>
                                <input type="{{ field.field.widget.input_type }}"
                                       name="{{ field.html_name }}"
                                       class="form-control form-control-lg {% if field.errors %}is-invalid{% endif %}"
                                       placeholder="{{ field.label }}"
                                       {% if field.field.required %}required{% endif %}>
                                {% for error in field.errors %}
                                    <div class="invalid-feedback">{{ error }}</div>
                                {% endfor %}
                            </div>
                        {% endfor %}

                       <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="fas fa-user-plus me-2"></i>Зарегистрироваться
                       </button>
                    </form>

                    <div class="mt-3 text-center">
                        <a href="{% url 'login' %}" class="text-muted small">
                            Уже есть аккаунт? Войти
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
