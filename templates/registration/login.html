<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Студенческий Помощник</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            color: #333;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            padding: 2.5rem;
            max-width: 420px;
            width: 100%;
        }
        .btn-primary { background: #667eea; border: none; transition: all 0.3s; }
        .btn-primary:hover { background: #5a6ee6; transform: translateY(-2px); }
        .btn-register {
            background: transparent;
            border: 2px solid #667eea;
            color: #667eea;
            transition: all 0.3s;
        }
        .btn-register:hover { background: #667eea; color: white; }
        .divider { border-top: 1px solid #eee; margin: 1.5rem 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <div class="login-card mx-auto">
                    <div class="text-center mb-4">
                        <i class="fas fa-graduation-cap fa-3x" style="color:#667eea"></i>
                        <h3 class="mt-2 fw-bold">Студенческий Помощник</h3>
                        <p class="text-muted small">Войдите в свой аккаунт</p>
                    </div>

                    {% if form.errors %}
                        <div class="alert alert-danger">
                            Неправильное имя пользователя или пароль
                        </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="fas fa-user me-1"></i> Имя пользователя
                            </label>
                            <input type="text" name="username" class="form-control form-control-lg"
                                   placeholder="Введите имя пользователя" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">
                                <i class="fas fa-lock me-1"></i> Пароль
                            </label>
                            <input type="password" name="password" class="form-control form-control-lg"
                                   placeholder="Введите пароль" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="fas fa-sign-in-alt me-2"></i>Войти
                        </button>
                    </form>

                    <div class="divider"></div>

                    <div class="text-center">
                        <p class="text-muted mb-2">Нет аккаунта?</p>
                        <a href="{% url 'accounts:register' %}" class="btn btn-register btn-lg w-100">
                            <i class="fas fa-user-plus me-2"></i>Зарегистрироваться
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
