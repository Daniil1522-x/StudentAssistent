{% extends "base.html" %}

{% block title %}#{{ room.name }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="fas fa-hashtag me-2"></i>{{ room.name }}</h1>
    <a href="{% url 'chat:chat_list' %}" class="btn btn-outline-secondary btn-sm">← Все чаты</a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <div id="messages" style="height:450px; overflow-y:auto; padding:1rem;">
        </div>
    </div>
    <div class="card-footer">
        <div class="input-group">
            <input type="text" id="messageInput" class="form-control form-control-lg"
                   placeholder="Введите сообщение..." autocomplete="off">
            <button class="btn btn-primary" id="sendBtn">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<script>
    const roomName = '{{ room.name }}';
    const username = '{{ request.user.username }}';
    const wsUrl = `ws://${window.location.host}/ws/chat/${roomName}/`;

    const socket = new WebSocket(wsUrl);
    const messages = document.getElementById('messages');
    const input = document.getElementById('messageInput');

    socket.onmessage = function(e) {
        const data = JSON.parse(e.data);
        const isMe = data.username === username;

        const div = document.createElement('div');
        div.className = `d-flex mb-3 ${isMe ? 'justify-content-end' : ''}`;
        div.innerHTML = `
            <div class="p-2 rounded-3 ${isMe ? 'bg-primary text-white' : 'bg-light'}" style="max-width:70%;">
                ${!isMe ? `<small class="fw-bold d-block mb-1">${data.username}</small>` : ''}
                <span>${data.message}</span>
                ${data.timestamp ? `<small class="d-block text-end opacity-75" style="font-size:0.7rem;">${data.timestamp}</small>` : ''}
            </div>
        `;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    };

    socket.onclose = function() {
        console.log('WebSocket закрыт');
    };

    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
        const msg = input.value.trim();
        if (msg && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ message: msg }));
            input.value = '';
        }
    }
</script>
{% endblock %}
