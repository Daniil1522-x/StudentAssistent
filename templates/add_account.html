{% extends "base.html" %}

{% block title %}Добавить аккаунт{% endblock %}

{% block content %}
<div class="pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="fas fa-key me-2"></i>Добавить аккаунт</h1>
</div>

<div class="col-lg-6">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <form method="post" action="{% url 'security:add_account' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Название сервиса / сайта</label>
                    <input type="text" name="service" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Логин / Email</label>
                    <input type="text" name="login" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Пароль</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">URL (необязательно)</label>
                    <input type="url" name="url" class="form-control" placeholder="https://example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Заметки</label>
                    <textarea name="notes" class="form-control" rows="2"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-2"></i>Сохранить
                </button>
                <a href="{% url 'security:passwords' %}" class="btn btn-outline-secondary ms-2">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
